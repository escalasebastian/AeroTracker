telegram.command.unknown=\u26A0\uFE0F Comando no reconocido. Escribe `/start` para ver las instrucciones.
telegram.command.empty=\u26A0\uFE0F Por favor, escribe un comando v\u00E1lido.
telegram.price.invalid-format=\u26A0\uFE0F Formato incorrecto. Ejemplos:\n\u2708\uFE0F *Solo ida:* `/price MAD AMS 2027-03-15`\n\uD83D\uDD04 *Ida y vuelta:* `/price MAD AMS 2027-03-15 2027-03-22`
telegram.price.invalid-date=\u26A0\uFE0F Formato de fecha inv\u00E1lido. Usa el formato `YYYY-MM-DD` (ej. `2027-03-15`).
telegram.price.result=\uD83D\uDCCA *Resultado de la b\u00FAsqueda:*\n\n\uD83D\uDCCD *Origen:* {0}\n\uD83C\uDFC1 *Destino:* {1}\n\uD83D\uDCC5 *Ida:* {2}\n{3}\n\uD83D\uDCB5 *Precio simulado:* *{4} {5}*\n\n\uD83D\uDCA1 Es un precio de demostraci\u00F3n. Los precios reales de Google Flights se consultan cuando creas una alerta con `/track`.
telegram.price.result.return-date=\uD83D\uDCC5 *Vuelta:* {0}
telegram.error.unexpected=\u26A0\uFE0F Ocurri\u00F3 un error inesperado al consultar el precio.
telegram.error.invalid-date-range=\u26A0\uFE0F La fecha de vuelta no puede ser anterior a la fecha de ida.
telegram.error.past-date=\u26A0\uFE0F Esa fecha de salida ya ha pasado. Elige una fecha futura.
telegram.error.invalid-airport=\u26A0\uFE0F Los aeropuertos se escriben con su c\u00F3digo IATA de 3 letras, por ejemplo `MAD` (Madrid) o `AMS` (\u00C1msterdam).
telegram.error.same-airport=\u26A0\uFE0F El origen y el destino deben ser aeropuertos distintos.
telegram.track.invalid-target-price=\u26A0\uFE0F El precio objetivo debe ser una cantidad positiva de hasta 100000, con dos decimales como m\u00E1ximo, por ejemplo `150` o `149.99`.
telegram.start.help=👋 \u00A1Hola! Bienvenido a *AeroTracker*.\n\nPuedo ayudarte a consultar precios y crear alertas de vuelos usando los siguientes comandos:\n\n✈️ *Precio simulado al momento:*\n`/price MAD AMS 2027-03-15`\n\n🎯 *Alerta con precios reales de Google Flights:*\n`/track MAD AMS 2027-03-15 150` (Solo ida, objetivo 150€)\n`/track MAD AMS 2027-03-15 2027-03-22 150` (Ida y vuelta)\n\n📋 *Ver mis alertas activas:*\n`/list`\n\n🗑️ *Cancelar una alerta:*\n`/untrack 1` (Usa el número que te muestra /list)
telegram.track.invalid-format=⚠️ Formato incorrecto para /track.\nEjemplos:\n✈️ *Solo ida:* `/track MAD AMS 2027-03-15 150`\n🔄 *Ida y vuelta:* `/track MAD AMS 2027-03-15 2027-03-22 150`
telegram.track.success=🎯 *¡Alerta guardada con éxito!*\n\n✈️ *Ruta:* {0} ➔ {1}\n📅 *Salida:* {2}\n{3}💶 *Precio objetivo:* *{4} €*\n\nTe avisaré en cuanto el precio baje hasta este importe o menos.
telegram.track.return-line=📅 *Regreso:* {0}\n
telegram.track.route-limit-reached=🚦 *Límite de seguimiento alcanzado.*\n\nEsta es una demo pública que funciona con un plan gratuito de datos de vuelos, así que sigue como máximo *{0}* rutas distintas a la vez.\n\nAún puedes seguir cualquier ruta que otra persona ya esté vigilando, o volver a intentarlo más tarde cuando se libere un hueco. Mientras tanto, `/price` te da al momento un precio simulado.
telegram.track.user-limit-reached=🚦 *Límite de alertas alcanzado.*\n\nCada persona puede tener hasta *{0}* alertas activas a la vez, para que haya sitio para todos.\n\nCancela una con `/untrack` (los números están en `/list`) para crear otra nueva.
telegram.list.header=📋 *Tus alertas activas:*\n\n
telegram.list.empty=📭 No tienes ninguna alerta activa actualmente.\n\nEscribe `/track MAD AMS 2027-03-15 150` para crear una.
telegram.list.item={0}. ✈️ *{1} ➔ {2}* | 📅 {3} | 🎯 *{4} €*\n
telegram.untrack.invalid-format=⚠️ Formato incorrecto. Escribe el número de la alerta que deseas cancelar, por ejemplo:\n`/untrack 1`\n(Usa el comando `/list` para ver tus números).
telegram.untrack.success=🗑️ *Alerta #{0} cancelada correctamente.* Ya no recibirás notificaciones para ese vuelo.
telegram.untrack.not-found=⚠️ No se pudo encontrar o ya estaba cancelada la alerta *#{0}*. Usa `/list` para comprobar tus alertas activas.
telegram.alert.price-drop=🔔 *¡ALERTA DE PRECIO!*\n\n✈️ *Ruta:* {0} ➔ {1}\n📅 *Ida:* {2}\n{3}💰 *Precio actual:* *{4} {5}*\n🎯 *Tu objetivo:* *{6} {5}*\n\n🎉 ¡El precio ha bajado hasta tu objetivo o menos!
telegram.alert.price-drop.return-line=📅 *Vuelta:* {0}\n