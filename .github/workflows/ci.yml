name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permissions required to publish packages to GitHub Container Registry
permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aerotracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_port_connectivity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Use Maven's native cache to speed up dependency resolution
          
      - name: Build and Test with Maven
        run: ./mvnw clean verify

  docker-build:
    name: Build and Push Docker Images
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Log in to GitHub Container Registry using the token injected by GitHub
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      # Enable support for advanced Docker features (BuildKit)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
          
      - name: Build and Push aerotracker-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./aerotracker-api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/aerotracker-api:latest
            ghcr.io/${{ github.repository }}/aerotracker-api:${{ github.sha }}
            
      - name: Build and Push aerotracker-scheduler
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./aerotracker-scheduler/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/aerotracker-scheduler:latest
            ghcr.io/${{ github.repository }}/aerotracker-scheduler:${{ github.sha }}
            
      - name: Build and Push aerotracker-price-checker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./aerotracker-price-checker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/aerotracker-price-checker:latest
            ghcr.io/${{ github.repository }}/aerotracker-price-checker:${{ github.sha }}
            
      - name: Build and Push aerotracker-notification
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./aerotracker-notification/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/aerotracker-notification:latest
            ghcr.io/${{ github.repository }}/aerotracker-notification:${{ github.sha }}
